<!-- MASTER -->
<div class="complete_master" id="le_master">
    <div class="filter" id="id_div_filter">
        <select id="id_selecteur_groupe">
            <!-- BEGIN une_formation -->
            <optgroup label="{une_formation.FORM_NOM}">
            <!-- BEGIN un_groupe -->
            <option value="{un_groupe.GROUPE_ID}" {un_groupe.SELECTED}>{un_groupe.GROUPE_NOM}</option>
            <!-- END un_groupe -->
            <!-- END une_formation -->
        </select>
    </div>
    <div class="master">
        <div>
            <!-- BEGIN un_etudiant -->
            <a href="?p=accueil&amp;g={GROUPE}&amp;e={un_etudiant.ET_ID}">{un_etudiant.ET_NOM}</a><br/>
            <!-- END un_etudiant -->
        </div>
    </div>
</div>
<!-- DETAIL -->
<div id="detail">
    <a class="show_master" href="#"><img src="../bfmw/images/fleche.png?bfmw_version_cache={BFMW_GLOBAL_DAYTIME}" class="masque_master" alt="Menu"/></a>
    <!-- BEGIN show -->
    <table class="releve">
        <tr>
            <td colspan="3" class="text_align_center"><img src="../trombi/{ET_NUMERO}.jpg?bfmw_version_cache={BFMW_GLOBAL_DAYTIME}"  loading="lazy" alt="" title="{ET_NOM}" class="specific_img_accueil_2"/>
                <br/>BAC : <span class="vert">{ET_BAC}</span>
                <!-- IF ET_RED != "" -->
                <br/>{ET_RED}
                <!-- ENDIF -->
                <!-- IF ET_TIERS != 0 -->
                <br/>Tiers temps
                <!-- ENDIF -->
            </td>
        </tr>
        <tr>
            <th colspan="3" class="text_align_center font_large">Fiche de {ET_NOM}</th>
        </tr>
        <tr>
            <th>MATIERES</th>
            <th>ENSEIGNANTS</th>
            <th>APPRECIATIONS</th>
        </tr>
        <!-- BEGIN une_ligne -->
        <tr>
            <td class="text_align_center text_vertical_middle">{une_ligne.PMAT_NOM}</td>
            <td class="text_align_center text_vertical_middle">
                <div>
                    <!-- BEGIN un_enseignant -->
                    {une_ligne.un_enseignant.ENS_NOM}<br/>
                    <!-- END un_enseignant -->
                </div>
            </td>
            <td class="text_align_center text_vertical_middle">{une_ligne.AVIS_APPRECIATION}</td>
        </tr>
        <!-- END une_ligne -->
    </table>
    <!-- END show -->
</div>
