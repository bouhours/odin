<div class="main">
    <div class="limited">
        <span class="font_large bleu">{NOM_COURS}</span><br/>
        <span class="font_large">avec&nbsp;</span><span class="font_large bleu">{ENSEIGNANT}</span><br/>
        <span class="font_large">Groupe&nbsp;</span><span class="font_large bleu">{GROUPE_NOM}</span><br/>
        <table class="releve">
            <tr>
                <th>Nom</th>
                <th>Photo</th>
                <th>Signature</th>
            </tr>
            <!-- BEGIN un_etudiant -->
            <tr>
                <td class="text_vertical_middle text_align_center font_large">{un_etudiant.ET_NOM}</td>
                <td class="text_vertical_middle text_align_center">
                    <img class="specific_img_signer_2" alt="" title="" src="../trombi/{un_etudiant.ET_NUMERO}.jpg?bfmw_version_cache={BFMW_GLOBAL_DAYTIME}"  loading="lazy"/>
                </td>
                <td>
                    <!-- IF un_etudiant.HAS_SIGNED -->
                    <img class="specific_img_signer_1" src="images/valider.png?bfmw_version_cache={BFMW_GLOBAL_DAYTIME}" alt="Signé"
                         title="Signature enregistrée"/>
                    <!-- ELSE -->
                    <button class="button do_sign" id="{un_etudiant.ET_ID}_bouton" data-bfmw2="{un_etudiant.EDT_UID}"
                            data-bfmw="{un_etudiant.ET_ID}" data-bfmw3="0" data-bfmw4="{GROUPE_ID}"
                            data-bfmw5="{un_etudiant.ET_NOM}">Signer
                    </button>
                    <img class="hide specific_img_signer_1" id="{un_etudiant.ET_ID}_ok" src="images/valider.png?bfmw_version_cache={BFMW_GLOBAL_DAYTIME}"
                         alt="Signé" title="Signature enregistrée"/>
                    <!-- ENDIF -->
                </td>
            </tr>
            <!-- END un_etudiant -->
            <tr>
                <td colspan="3">
                    <form method="POST" action="?p=choisir_matiere" class="">
                        <input type="hidden" value="{EDT_UID}" name="d"/>
                        <input type="submit" value="Faire signer l'enseignant" class="" name="signer_prof"/>
                        <input type="hidden" value="{EDT_ENS_ID}" name="p"/>
                        <input type="hidden" value="{ENSEIGNANT}" name="n"/>
                        <input type="hidden" value="-1" name="g"/>
                    </form>
                </td>
            </tr>
        </table>


    </div>
</div>
